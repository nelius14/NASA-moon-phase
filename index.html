<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Moon">
  <title>Moon Phase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: rgba(228, 218, 188, 0.90);
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Cormorant Garamond', 'Georgia', serif;
      user-select: none;
      -webkit-user-select: none;
      /* safe area for notched devices */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* ── Two-column layout ───────────────── */
    .layout {
      display: flex;
      align-items: center;
      gap: 4rem;
      padding: 2rem;
      animation: rise 1.2s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Portrait: stack moon top, info below */
    @media (orientation: portrait) {
      .layout {
        flex-direction: column;
        gap: 2rem;
        justify-content: center;
      }
      .moon-ring {
        width: min(78vw, 480px) !important;
        height: min(78vw, 480px) !important;
      }
      .info { align-items: center; text-align: center; gap: 1.2rem !important; }
      .time { font-size: 3.5rem !important; }
      .phase-name { font-size: 2rem !important; }
    }

    /* iPad mini 2 landscape — 1024×768 CSS px
       Moon capped at 450px → info panel gets ~470px to breathe */
    @media (max-width: 1080px) and (orientation: landscape) {
      .moon-ring {
        width: 450px !important;
        height: 450px !important;
      }
      .layout { gap: 2rem; padding: 0.6rem 1rem; }
      .info { gap: 1.6rem; }
      .date { font-size: 0.85rem; letter-spacing: 0.14em; }
      .phase-label { font-size: 0.75rem; letter-spacing: 0.14em; }
      .phase-name { font-size: 3rem; }
    }

    /* ── Moon ────────────────────────────── */
    .moon-ring {
      flex-shrink: 0;
      width: min(82vh, 680px);
      height: min(82vh, 680px);
      border-radius: 50%;
      overflow: hidden;
      position: relative;
    }

    #moon-img {
      width: 100%;
      height: 100%;
      object-fit: none;
      object-position: center;
      transform: scale(2)
      display: block;
    }

    .moon-status {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: rgba(8,8,8,0.8);
      font-family: 'Inconsolata', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(180,172,155,0.5);
      text-align: center;
      padding: 2rem;
      line-height: 1.9;
      transition: opacity 0.5s;
    }
    .moon-status.hidden { opacity: 0; pointer-events: none; }

    /* ── Info panel ──────────────────────── */
    .info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* date + time */
    .dateline {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .date {
      font-family: 'Inconsolata', monospace;
      font-size: 2.1rem;
      letter-spacing: 0.18em;
      color: rgba(180,172,155,0.99);
      text-transform: uppercase;
    }
    .time {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(4rem, 9vw, 8rem);
      font-weight: 300;
      color: rgba(228,218,188,1);
      letter-spacing: -0.01em;
      line-height: 1;
      white-space: nowrap;
    }

    /* phase */
    .phase-block {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .phase-label {
      font-family: 'Inconsolata', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      color: rgba(180,172,155,0.4);
      text-transform: uppercase;
    }
    .phase-name {
      font-size: clamp(2rem, 4.5vw, 4rem);
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.06em;
      line-height: 1.1;
      color: rgba(228,218,188,0.92);
    }

    /* stats grid */
    .stats {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .stat {
      display: flex;
      flex-direction: column;
      gap: 0.18rem;
    }
    .stat-value {
      font-family: 'Inconsolata', monospace;
      font-size: 1.2rem;
      color: rgba(228,218,188,0.88);
      letter-spacing: 0.03em;
    }
    .stat-label {
      font-family: 'Inconsolata', monospace;
      font-size: 0.57rem;
      letter-spacing: 0.14em;
      color: rgba(180,172,155,0.38);
      text-transform: uppercase;
    }

    /* divider */
    .divider {
      width: 100%;
      height: 1px;
      background: rgba(228,218,188,0.08);
    }

    /* upcoming events */
    .events-label {
      font-family: 'Inconsolata', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      color: rgba(180,172,155,0.4);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .events {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }
    .event {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }
    .event-icon { font-size: 1rem; line-height: 1; width: 1.2rem; text-align: center; }
    .event-text { display: flex; flex-direction: column; gap: 0.05rem; }
    .event-name { font-family: 'Inconsolata', monospace; font-size: 0.68rem; letter-spacing: 0.06em; color: rgba(200,193,172,0.7); }
    .event-days { font-family: 'Inconsolata', monospace; font-size: 0.58rem; letter-spacing: 0.1em; color: rgba(180,172,155,0.38); text-transform: uppercase; }

    /* credit */
    .credit {
      font-family: 'Inconsolata', monospace;
      font-size: 0.48rem;
      letter-spacing: 0.09em;
      color: rgba(180,172,155,0.18);
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

<div class="layout">

  <!-- Left: moon photograph -->
  <div class="moon-ring" id="moon-ring">
    <img id="moon-img" src="" alt="moon phase" decoding="async">
    <div class="moon-status" id="moon-status">loading image…</div>
  </div>

  <!-- Right: information -->
  <div class="info">

    <div class="dateline">
      <div class="date" id="date-display">—</div>
      <div class="time" id="time-display">—</div>
    </div>

    <div class="phase-block">
      <div class="phase-label">Current phase</div>
      <div class="phase-name" id="phase-name">—</div>
    </div>

    <div class="phase-block">
      <div class="phase-label">Illuminated</div>
      <div class="phase-name" id="illum">—</div>
    </div>

    <div class="credit">NASA SVS · Lunar Reconnaissance Orbiter · Public domain</div>

  </div>
</div>

<script>
// ── Lunar maths ──────────────────────────────────────────────
// Elongation (Moon minus Sun ecliptic longitude) from Meeus,
// "Astronomical Algorithms" ch. 47 (truncated series) and ch. 25 (low-precision Sun).
// Accurate to roughly 0.3 degrees, i.e. well under an hour of phase.
const CYCLE = 29.530588853; // mean synodic month, only used to express age in days

function toJD(d) { return d / 86400000 + 2440587.5; }

const RAD = Math.PI / 180;
const norm360 = x => ((x % 360) + 360) % 360;

// [D, M, M', F, coefficient in 1e-6 degrees]
const MOON_LON_TERMS = [
  [0,0,1,0,6288774],[2,0,-1,0,1274027],[2,0,0,0,658314],[0,0,2,0,213618],
  [0,1,0,0,-185116],[0,0,0,2,-114332],[2,0,-2,0,58793],[2,-1,-1,0,57066],
  [2,0,1,0,53322],[2,-1,0,0,45758],[0,1,-1,0,-40923],[1,0,0,0,-34720],
  [0,1,1,0,-30383],[2,0,0,-2,15327],[0,0,1,2,-12528],[0,0,1,-2,10980],
  [4,0,-1,0,10675],[0,0,3,0,10034],[4,0,-2,0,8548],[2,1,-1,0,-7888],
  [2,1,0,0,-6766],[1,0,-1,0,-5163],[1,1,0,0,4987],[2,-1,1,0,4036],
  [2,0,2,0,3994],[4,0,0,0,3861],[2,0,-3,0,3665],[0,1,-2,0,-2689],
  [2,0,-1,2,-2602],[2,-1,-2,0,2390],[1,0,1,0,-2348],[2,-2,0,0,2236],
  [0,1,2,0,-2120],[0,2,0,0,-2069],[2,-2,-1,0,2048]
];

function elongation(jd) {
  const T = (jd - 2451545.0) / 36525;
  const Lm = norm360(218.3164477 + 481267.88123421 * T);
  const D  = norm360(297.8501921 + 445267.1114034 * T);
  const M  = norm360(357.5291092 + 35999.0502909 * T);
  const Mp = norm360(134.9633964 + 477198.8675055 * T);
  const F  = norm360(93.2720950 + 483202.0175233 * T);
  const E  = 1 - 0.002516 * T - 0.0000074 * T * T;
  let sum = 0;
  for (const [d, m, mp, f, c] of MOON_LON_TERMS) {
    const e = m === 0 ? 1 : (Math.abs(m) === 1 ? E : E * E);
    sum += c * e * Math.sin((d * D + m * M + mp * Mp + f * F) * RAD);
  }
  const A1 = 119.75 + 131.849 * T, A2 = 53.09 + 479264.290 * T;
  sum += 3958 * Math.sin(A1 * RAD) + 1962 * Math.sin((Lm - F) * RAD) + 318 * Math.sin(A2 * RAD);
  const moonLon = Lm + sum / 1e6;

  const L0 = 280.46646 + 36000.76983 * T;
  const Ms = (357.52911 + 35999.05029 * T) * RAD;
  const C  = (1.914602 - 0.004817 * T) * Math.sin(Ms)
           + 0.019993 * Math.sin(2 * Ms) + 0.000289 * Math.sin(3 * Ms);
  return norm360(moonLon - (L0 + C));
}

function moonData(date) {
  const elong = elongation(toJD(date));
  const phase = elong / 360;
  const illum = (1 - Math.cos(elong * RAD)) / 2;
  return { phase, age: phase * CYCLE, illum };
}

function phaseName(p) {
  if (p < 0.025 || p >= 0.975) return 'New Moon';
  if (p < 0.225) return 'Waxing Crescent';
  if (p < 0.275) return 'First Quarter';
  if (p < 0.475) return 'Waxing Gibbous';
  if (p < 0.525) return 'Full Moon';
  if (p < 0.725) return 'Waning Gibbous';
  if (p < 0.775) return 'Last Quarter';
  return 'Waning Crescent';
}

// ── NASA SVS frame lookup ────────────────────────────────────
// SVS-5187: 8784 frames, one per UTC hour of 2024 (leap year).
// Frame 1 = Jan 1, 2024 00:00 UTC. Public domain.
// We pick the 2024 hour whose true elongation is closest to now, so the
// photo shows the same real phase as the text.
const JD_JAN1_2024   = 2460310.5;
const FRAMES_IN_2024 = 8784;
const BASE = 'https://svs.gsfc.nasa.gov/vis/a000000/a005100/a005187/frames/730x730_1x1_30p/';

const FRAME_ELONG = new Float32Array(FRAMES_IN_2024);
for (let i = 0; i < FRAMES_IN_2024; i++) {
  FRAME_ELONG[i] = elongation(JD_JAN1_2024 + i / 24);
}

function frameUrl(phase) {
  const target = phase * 360;
  let best = 0, bestDiff = 360;
  for (let i = 0; i < FRAMES_IN_2024; i++) {
    let d = Math.abs(FRAME_ELONG[i] - target);
    if (d > 180) d = 360 - d;
    if (d < bestDiff) { bestDiff = d; best = i; }
  }
  return BASE + 'moon.' + String(best + 1).padStart(4, '0') + '.jpg';
}

// ── Clock ────────────────────────────────────────────────────
function tick() {
  const n = new Date();
  const dateEl = document.getElementById('date-display');
  dateEl.innerHTML =
    n.toLocaleDateString('en-GB', { weekday:'long' }).toUpperCase() +
    '<br>' +
    n.toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' }).toUpperCase();
  document.getElementById('time-display').textContent =
    n.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}

// ── Boot ─────────────────────────────────────────────────────
window.addEventListener('load', () => {
  tick();
  setInterval(() => { tick(); fitTime(); }, 60000);

  const img    = document.getElementById('moon-img');
  const status = document.getElementById('moon-status');

  function renderMoon(bustCache) {
    const { phase, illum } = moonData(new Date());
    const url = frameUrl(phase);
    img.src = bustCache ? url + '?t=' + Date.now() : url;
    document.getElementById('phase-name').textContent = phaseName(phase);
    document.getElementById('illum').textContent      = Math.round(illum * 100) + '%';
    fitTime();
  }

  // Refresh clock, photo and phase text when iPad wakes from sleep
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      tick();
      renderMoon(true); // also re-fits the time width
    }
  });

  img.onload = () => {
    status.classList.add('hidden');
  };

  img.onerror = () => {
    status.innerHTML =
      'NASA image unavailable.<br><br>' +
      'Serve via local server:<br>' +
      'python3 -m http.server 8080<br>' +
      'then open localhost:8080/index.html';
  };

  renderMoon(false);

  // Match time width to phase-name width using off-screen probe spans
  function fitTime() {
    const phaseEl = document.getElementById('phase-name');
    const timeEl  = document.getElementById('time-display');

    // Measure actual rendered text width of the phase name
    const cs = getComputedStyle(phaseEl);
    const phaseProbe = document.createElement('span');
    phaseProbe.style.cssText =
      'position:absolute;visibility:hidden;white-space:nowrap;' +
      'font-family:' + cs.fontFamily + ';' +
      'font-size:'   + cs.fontSize   + ';' +
      'font-weight:' + cs.fontWeight + ';' +
      'font-style:'  + cs.fontStyle  + ';' +
      'letter-spacing:' + cs.letterSpacing + ';';
    phaseProbe.textContent = phaseEl.textContent;
    document.body.appendChild(phaseProbe);
    const target = phaseProbe.offsetWidth;
    document.body.removeChild(phaseProbe);

    // Binary search: find the font-size where time text hits that width
    const ct = getComputedStyle(timeEl);
    const timeProbe = document.createElement('span');
    timeProbe.style.cssText =
      'position:absolute;visibility:hidden;white-space:nowrap;' +
      'font-family:' + ct.fontFamily + ';' +
      'font-weight:' + ct.fontWeight + ';' +
      'letter-spacing:' + ct.letterSpacing + ';';
    timeProbe.textContent = timeEl.textContent;
    document.body.appendChild(timeProbe);

    let lo = 10, hi = 600;
    while (hi - lo > 0.5) {
      const mid = (lo + hi) / 2;
      timeProbe.style.fontSize = mid + 'px';
      if (timeProbe.offsetWidth < target) lo = mid;
      else hi = mid;
    }
    document.body.removeChild(timeProbe);
    timeEl.style.fontSize = Math.floor(lo) + 'px';
  }

  document.fonts.ready.then(fitTime);
});
</script>
</body>
</html>
